name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Playwright installs no Chromium on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The Steel page tools are tested against a real browser over real
      # CDP; a mocked protocol would only ever agree with itself.
      - run: bunx playwright install --with-deps chromium
      - run: bun --filter runline build
      # Plugins and pi-runline resolve runline through its built types.
      - run: bun run typecheck
      - run: bun --filter runline test
      # Lint/format across the whole monorepo — catches issues in
      # pi-runline and runline-plugins that the runline filter misses.
      - run: bun run check
