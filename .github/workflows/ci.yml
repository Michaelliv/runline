name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The Steel page tools are tested against a real browser over real
      # CDP; a mocked protocol would only ever agree with itself.
      - run: bunx playwright install --with-deps chromium
      - run: bun --filter @shiftlabs/codemode build
      # The plugins and the runline package resolve codemode through its built types.
      - run: bun run typecheck
      - run: bun --filter @shiftlabs/codemode test
      # Lint and format across the whole monorepo, codemode-plugins included.
      - run: bun run check
