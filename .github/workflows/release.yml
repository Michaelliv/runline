name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  # Serialize releases so two tags can't race on the same npm package.
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun --filter @shiftlabs/codemode build
      - run: bun --filter @shiftlabs/codemode test
      - run: bun run check

  verify-versions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODEMODE=$(node -p "require('./packages/codemode/package.json').version")
          RUNLINE=$(node -p "require('./packages/runline/package.json').version")
          FORWARDS_TO=$(node -p "require('./packages/runline/package.json').dependencies['@shiftlabs/codemode']")
          echo "tag=$TAG codemode=$CODEMODE runline=$RUNLINE forwards-to=$FORWARDS_TO"
          for VERSION in "$CODEMODE" "$RUNLINE" "$FORWARDS_TO"; do
            if [ "$VERSION" != "$TAG" ]; then
              echo "::error::a package version ($VERSION) does not match tag ($TAG)"
              exit 1
            fi
          done

  publish:
    needs: verify-versions
    runs-on: ubuntu-latest
    strategy:
      # One job per package, in order: runline forwards to the codemode
      # published just before it, and its failure does not undo codemode's.
      # Each publishes with the token that covers its name on npm.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - package: codemode
            token: SHIFTLABS_NPM_TOKEN
          - package: runline
            token: NPM_TOKEN
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun --filter @shiftlabs/codemode build
      - name: Publish to npm
        working-directory: packages/${{ matrix.package }}
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '(rc|alpha|beta)'; then
            npm publish --tag next --access public
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets[matrix.token] }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
